name: Publish EAS Update (manual selection)

# Runs on tags shaped like update/<channel>/<label>, e.g.
# "update/preview/1-3-0" or "update/production/2-0-0" (":" is not a
# valid character in a git ref name, so "/" separates the segments).
# The channel segment is used both as the EAS branch updates are
# published to AND as the EAS environment whose EXPO_PUBLIC_* variables
# get baked into the bundle - so a "preview" tag always gets preview
# config, and a "production" tag always gets production config. It
# also becomes the value apps filter the update list by (see
# listAvailableUpdates() in the client), so an app running a
# "production" build never sees, and can never select, an update
# published under a different channel.
on:
  push:
    tags:
      - 'update/**'

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Extract environment and label from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREFIX="${TAG%%/*}"
          REST="${TAG#*/}"
          ENVIRONMENT="${REST%%/*}"
          LABEL="${REST#*/}"
          if [ "$PREFIX" != "update" ] || [ -z "$ENVIRONMENT" ] || [ -z "$LABEL" ] || [ "$ENVIRONMENT" = "$REST" ]; then
            echo "Tag '$TAG' is not shaped like update/<channel>/<label> - skipping." >&2
            exit 1
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Publish EAS Update
        # --environment makes `eas update` pull that EAS environment's
        # EXPO_PUBLIC_* (and other) variables into the bundle - the same
        # way `eas build` does. Without it, `eas update` only reads local
        # .env files, which don't exist in this checkout (gitignored), so
        # every EXPO_PUBLIC_* var would get inlined as literally undefined.
        run: |
          eas update --branch "${{ steps.tag.outputs.environment }}" \
            --environment "${{ steps.tag.outputs.environment }}" \
            --message "$(git log -1 --pretty=%B | head -n 1)" \
            --non-interactive --json > eas-update-result.json
          cat eas-update-result.json

      - name: Read project ID from app.json
        id: project
        run: |
          PROJECT_ID=$(node -e "console.log(require('./app.json').expo.extra.manualUpdates.projectId)")
          echo "id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Report update to manual-updates server
        env:
          SERVER_URL: ${{ secrets.MANUAL_UPDATES_SERVER_URL }}
          API_KEY: ${{ secrets.MANUAL_UPDATES_API_KEY }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
          ENVIRONMENT: ${{ steps.tag.outputs.environment }}
          LABEL: ${{ steps.tag.outputs.label }}
        run: |
          node -e "
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('eas-update-result.json', 'utf8'));
            const list = Array.isArray(raw) ? raw : (raw.updates || [raw]);
            const first = list[0] || {};
            fetch(process.env.SERVER_URL + '/api/updates', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.API_KEY,
              },
              body: JSON.stringify({
                projectId: process.env.PROJECT_ID,
                environment: process.env.ENVIRONMENT,
                label: process.env.LABEL,
                message: first.message || null,
                easUpdateGroupId: first.group || first.id || null,
                runtimeVersion: first.runtimeVersion || null,
                platforms: list.map((u) => u.platform).filter(Boolean),
                createdAt: first.createdAt || new Date().toISOString(),
              }),
            }).then(async (res) => {
              if (!res.ok) {
                console.error(await res.text());
                process.exit(1);
              }
              console.log('Reported update to manual-updates server.');
            });
          "
